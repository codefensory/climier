<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Climier">
  <style>
    .mark-dark { display: none }
    @media (prefers-color-scheme: dark) {
      .mark-light { display: none }
      .mark-dark { display: inline }
    }
  </style>
  <image class="mark-light" width="120" height="120" href="data:image/png;base64,"/>
  <image class="mark-dark" width="120" height="120" href="data:image/png;base64,"/>
</svg>
