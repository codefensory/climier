name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:cut
      - run: bun scripts/type-budget.ts
      - run: bun run test
      - run: bun run surface:check
      - run: bun run smoke:pack
      - run: bun run pack:check

  commitlint:
    name: lint pull request commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Validate commit messages
        run: bunx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  commit-audit:
    name: audit main commit node IDs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report commits without node IDs
        shell: bash
        run: |
          set -u
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            range="$after"
          else
            range="$before..$after"
          fi

          found=0
          while IFS=$'\t' read -r sha subject; do
            [ -n "$sha" ] || continue
            case "$subject" in
              Merge\ *|Revert\ *|fixup\!\ *|squash\!\ *|amend\!\ *|release:\ v*|chore\(release\):*|chore\(release\)\!:*)
                continue
                ;;
            esac
            if ! [[ "$subject" =~ \[[^][:space:]]+\]$ ]]; then
              echo "::warning title=Commit missing node-id::$sha $subject"
              found=1
            fi
          done < <(git log --format='%H%x09%s' "$range")

          if [ "$found" -eq 0 ]; then
            echo "Commit audit: all commits include [node-id]."
          else
            echo "Commit audit found commits without [node-id]; reporting only (non-blocking)."
          fi

  binaries:
    name: binary (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            extension: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            extension: ""
          - name: darwin-x64
            os: macos-15-intel
            target: bun-darwin-x64
            extension: ""
          - name: darwin-arm64
            os: macos-14
            target: bun-darwin-arm64
            extension: ""
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build binaries
        run: bun run build:binary -- --target "${{ matrix.target }}" --output-dir dist
      - name: Smoke test CLI
        shell: bash
        run: |
          suffix="${{ matrix.extension }}"
          cli="dist/climier-${{ matrix.name }}$suffix"
          server="dist/climier-server-${{ matrix.name }}$suffix"
          test -f "$server"
          "$cli" --version
          project="$RUNNER_TEMP/climier-binary-smoke"
          plugin_home="$RUNNER_TEMP/climier-binary-plugin-home"
          plugin_dir="$plugin_home/plugins/installed/binary-smoke"
          rm -rf "$project" "$plugin_home"
          mkdir -p "$plugin_dir"
          cat > "$plugin_dir/package.json" <<'EOF'
          {"name":"binary-smoke","version":"1.0.0","type":"module","climier":{"id":"binary-smoke","command":"binary-smoke","entry":"./climier.mjs","api":1}}
          EOF
          cat > "$plugin_dir/climier.mjs" <<'EOF'
          export default { commands: { probe: (args, api) => ({ loaded: true, args, project: api.runtime.project_dir }) } };
          EOF
          CLIMIER_HOME="$plugin_home" "$cli" --project "$project" init
          CLIMIER_HOME="$plugin_home" "$cli" --project "$project" status
          output=$(CLIMIER_HOME="$plugin_home" "$cli" --project "$project" --as binary-smoke binary-smoke probe --external)
          echo "$output"
          echo "$output" | grep -Eq '"loaded"[[:space:]]*:[[:space:]]*true'
      - uses: actions/upload-artifact@v4
        with:
          name: climier-${{ matrix.name }}
          path: dist/climier-${{ matrix.name }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Generate release manifest
        run: bun scripts/manifest.ts --version "${GITHUB_REF_NAME#v}" --channel stable --dist dist --out dist/manifest.json
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum climier-linux-x64 climier-linux-arm64 climier-darwin-x64 climier-darwin-arm64 climier-windows-x64.exe > SHA256SUMS
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
