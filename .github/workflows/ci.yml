name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bun scripts/type-budget.ts
      - run: bun run test
      - run: bun run surface:check
      - run: bun run smoke:pack
      - run: bun run pack:check

  binaries:
    name: binary (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
            extension: ""
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            extension: ""
          - name: darwin-x64
            os: macos-13
            target: bun-darwin-x64
            extension: ""
          - name: darwin-arm64
            os: macos-14
            target: bun-darwin-arm64
            extension: ""
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build binaries
        run: bun run build:binary -- --target "${{ matrix.target }}" --output-dir dist
      - name: Smoke test CLI
        shell: bash
        run: |
          suffix="${{ matrix.extension }}"
          cli="dist/climier-${{ matrix.name }}$suffix"
          server="dist/climier-server-${{ matrix.name }}$suffix"
          test -f "$server"
          "$cli" --version
          project="$RUNNER_TEMP/climier-binary-smoke"
          rm -rf "$project"
          "$cli" --project "$project" init
          "$cli" --project "$project" status
      - uses: actions/upload-artifact@v4
        with:
          name: climier-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
