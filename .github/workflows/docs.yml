name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: build and validate docs
    runs-on: ubuntu-latest
    env:
      DOCS_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Typecheck docs
        working-directory: docs
        run: bun run typecheck
      - name: Build docs
        working-directory: docs
        run: bun run build
      - name: Prerender docs
        working-directory: docs
        run: bun run prerender
      - name: Scan public documentation
        run: node docs/scripts/check-public-docs.mjs
      - name: Verify guardrail fixtures
        run: node docs/scripts/check-public-docs.fixtures.mjs
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    name: deploy docs to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
