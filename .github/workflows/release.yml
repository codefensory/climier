name: release

on:
  push:
    branches: [main]
  # Bootstrap and recovery path: publish a tag that already exists in GitHub.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: create release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish npm package
    # The push path is gated by release-please; workflow_dispatch is manual only.
    if: >-
      ${{ always() &&
        ((github.event_name == 'push' &&
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true') ||
         github.event_name == 'workflow_dispatch') }}
    needs: release-please
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build UI and run publish gate
        run: bun run prepublishOnly
      - name: Smoke test the packed artifact
        run: bun run smoke:pack
      - name: Verify release tag and select npm dist-tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Publish package
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published version
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          published="$(npm view climier version --tag "$DIST_TAG")"
          test "$published" = "$expected"
