<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f6" />
    <script>
      (() => {
        const THEME_STORAGE_KEY = "climier-ui:theme";
        const META_THEME_COLOR = { light: "#f6f6f6", dark: "#0e0e11" };
        let preference = "system";
        let systemPrefersDark = false;

        try {
          const stored = window.localStorage.getItem(THEME_STORAGE_KEY);
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch {}

        try {
          systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {}

        try {
          const resolved = preference === "dark" || (preference === "system" && systemPrefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", META_THEME_COLOR[resolved]);
        } catch {}
      })();
    </script>
    <meta name="description" content="Una aplicación sencilla construida con SolidJS." />
    <title>Climier UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
